{% extends "admin/change_list.html" %}
{% load static %}
<!-- Override extrahead to add Chart.js -->
{% block extrahead %}
    {{ block.super }}
    <link rel="stylesheet" href="{% static "qux_api_log/css/qux_api_log.css" %}" />
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/2.8.0/Chart.bundle.min.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', () => {
        var container = document.getElementById('api-log-chart');
        var ctx = document.getElementById('chart').getContext('2d');

        // parse chart data
        var chartData = JSON.parse(document.getElementById('chartData').textContent);

        // Parse the dates to JS
        chartData.forEach((d) => {
            d.x = new Date(d.date).toJSON().slice(0, 10);
        });

        // Compose datasets from server fields
        var datasets = [
            { label: 'total', field: 'y', color: '#5eb4ef' },
            { label: '2xx', field: 'y2xx', color: '#28a745' },
            { label: '4xx', field: 'y4xx', color: '#ffc107' },
            { label: '5xx', field: 'y5xx', color: '#dc3545' },
        ].map(function (cfg) {
            return {
                label: cfg.label,
                data: chartData.map(function (d) { return { x: d.x, y: d[cfg.field] }; }),
                backgroundColor: cfg.color,
            };
        });

        // Render the chart
        var chart = new Chart(ctx, {
            type: 'bar',
            data: { datasets: datasets },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                legend: { 
                    display: true,
                    position: 'top',
                    labels: { 
                        fontColor: getComputedStyle(document.body).color,
                        padding: 15,
                        boxWidth: 12,
                        fontSize: 12
                    } 
                },
                scales: {
                    xAxes: [{
                        type: 'time',
                        time: { unit: 'day', round: 'day', displayFormats: { day: 'MMM D' } },
                        ticks: { fontColor: getComputedStyle(document.body).color },
                    }],
                    yAxes: [{
                        ticks: { beginAtZero: true, stepSize: 1, suggestedMax: 5, fontColor: getComputedStyle(document.body).color },
                    }],
                },
            },
        });

        

        var start = chartData.length ? moment(chartData[chartData.length - 1].x) : moment();
        var end = moment();
        var saved = window.localStorage.getItem('api_log_daterange');
        if (saved) {
            try {
                var obj = JSON.parse(saved);
                if (obj && obj.start && obj.end) {
                    start = moment(obj.start);
                    end = moment(obj.end);
                }
            } catch (e) {}
        }

    });
    </script>
    {{ chart_data|json_script:"chartData" }}
{% endblock extrahead %}
{% block result_list %}
    <div id="api-log-chart">
        <!-- Render the chart -->
        <div class="api-log-chart-canvas">
            <canvas id="chart"></canvas>
        </div>
    </div>
    {{ block.super }}
{% endblock result_list %}
